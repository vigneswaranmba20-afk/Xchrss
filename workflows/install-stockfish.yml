name: Install Stockfish 19 Lite

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-stockfish.yml'

permissions:
  contents: write

jobs:
  install-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download official matching Stockfish files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine
          npm pack stockfish@19.0.1 --pack-destination "$RUNNER_TEMP" --silent
          tar -xzf "$RUNNER_TEMP/stockfish-19.0.1.tgz" \
            -C engine --strip-components=2 \
            package/bin/stockfish-19-lite-single.js \
            package/bin/stockfish-19-lite-single.wasm
          test -s engine/stockfish-19-lite-single.js
          test -s engine/stockfish-19-lite-single.wasm
          ls -lh engine/stockfish-19-lite-single.*
          file engine/stockfish-19-lite-single.wasm

      - name: Save Stockfish into this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stockfish-19-lite-single.js engine/stockfish-19-lite-single.wasm
          if git diff --cached --quiet; then
            echo "Engine files are already committed."
          else
            git commit -m "Add Stockfish 19 Lite single-threaded engine"
            git push
          fi
